name: Build and Deploy to Server

on:
  push:
    branches: [ "main" ]

env:
  DEPLOY_PATH: ${{ vars.APP_PATH_PROD }}

jobs:
  deploy:
    name: Building and deploying on server
    runs-on: ubuntu-latest

    steps:
    - name: SSH debug
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: echo "SSH OK"
        debug: true

    - uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          cd ${{ vars.APP_PATH_PROD }}
          git fetch --all
          git checkout -B main origin/main
          BRANCH=main SITE_NAME=zapusk.io VITE_API_URL=https://zapusk.io/api ./update.sh
